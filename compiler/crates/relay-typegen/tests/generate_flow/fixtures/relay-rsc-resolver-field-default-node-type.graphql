# relay:enable_relay_rsc

fragment RelayRscResolverFieldDefaultNodeType_user on User @server {
  name
}

query RelayRscResolverFieldDefaultNodeTypeQuery @server {
  me {
    displayName: fullNameRsc
  }
}

# %extensions%

extend type User {
  fullNameRsc: RelayRscValue
    @relay_resolver(
      fragment_name: "RelayRscResolverFieldDefaultNodeType_user"
      import_path: "./FullNameRsc.server.js"
      import_name: "FullNameRsc"
    )
}
