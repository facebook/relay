# expected-to-throw
# relay:enable_relay_rsc
# An RSC field is implemented by the component export named after the field in
# PascalCase, so a lowercase export is rejected.

fragment RelayRscResolverFieldLowercaseExport_user on User @server {
  name
}

query RelayRscResolverFieldLowercaseExportQuery @server {
  me {
    fullNameRsc
  }
}

# %extensions%

extend type User {
  fullNameRsc: RelayRscValue
    @relay_resolver(
      fragment_name: "RelayRscResolverFieldLowercaseExport_user"
      import_path: "./FullNameRsc.server.js"
      import_name: "fullNameRsc"
    )
}
